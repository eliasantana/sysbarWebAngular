<app-topo></app-topo>

<mat-drawer-container class="container" autosize>    
    <mat-drawer #drawer class="sidenav" mode="side">
      <mat-nav-list>    
        <a mat-list-item routerLink="/principal" (click)="drawer.toggle()">
            <mat-icon matListItemIcon>home</mat-icon>
            <span matListItemTitle>Home</span>
        </a>
        <a mat-list-item routerLink="/principal/cargos" (click)="drawer.toggle()">
            <mat-icon matListItemIcon>badge</mat-icon>
            <span matListItemTitle>Cargos</span>               
        </a>          
        <a mat-list-item routerLink="/principal/empresa" (click)="drawer.toggle()">
            <mat-icon matListItemIcon>apartment</mat-icon>
            <span matListItemTitle>Empresas</span>               
        </a>          
        <a mat-list-item routerLink="/principal/funcionario" (click)="drawer.toggle()">
            <mat-icon matListItemIcon>group</mat-icon>
            <span matListItemTitle>Funcionários</span>               
        </a>          
        <a mat-list-item routerLink="/principal/estoque" (click)="drawer.toggle()">
            <mat-icon matListItemIcon>add_home_work</mat-icon>
            <span matListItemTitle>Estoque</span>               
        </a>          
        <a mat-list-item routerLink="/principal/produto" (click)="drawer.toggle()">
            <mat-icon matListItemIcon>trolley</mat-icon>            
            <span matListItemTitle>Produtos</span >               
        </a> 
        <a mat-list-item routerLink="/principal/mesas" (click)="drawer.toggle()">
            <mat-icon matListItemIcon>table_bar</mat-icon>            
            <span matListItemTitle>Mesas</span>               
        </a> 
        <a mat-list-item routerLink="/principal/dashboard" (click)="drawer.toggle()">
            <mat-icon matListItemIcon>dashboard_2_gear</mat-icon>            
            <span matListItemTitle>DashBoarding</span>               
        </a>
        <a mat-list-item routerLink="/principal/pedido" (click)="drawer.toggle()">
            <mat-icon matListItemIcon>receipt_long</mat-icon>            
            <span matListItemTitle>Pedidos</span>               
        </a>           
        <a mat-list-item routerLink="/" (click)="logout()">
            <mat-icon matListItemIcon>exit_to_app</mat-icon>
            <span matListItemTitle>Sair</span>               
        </a>          
      </mat-nav-list>         
    </mat-drawer>    
    <div class="sidenav-content">
        <div class="button-row">
            <div class="flex-container">                
                <button type="button"  matButton="elevated"  (click)="drawer.toggle()">      
                    <mat-icon>menu</mat-icon> Menu        
                </button>
                <div class="logo"> <img src="logo.png"> </div>                
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>  
  </mat-drawer-container>
  <app-rodape></app-rodape>
