<div class="container-formulario">    
    <div class="formulario">
        <h1 class="titulo">Adicionar Produtos ao Estoque</h1>
        
        <form class="formulario" [formGroup]="formulario">
            <div>
                <mat-form-field class="pequeno">
                    <mat-label>Código</mat-label>
                    <input type="number" matInput formControlName="cdEmpresa">
                </mat-form-field>
                <mat-form-field class="medio">
                    <mat-label>Empresa</mat-label>
                    <input matInput readonly="">
                </mat-form-field>  
            </div>                
            <div>
                <mat-form-field class="pequeno">
                    <mat-label>Cód. do Produto</mat-label>
                    <input type="number" matInput formControlName="cdProduto">
                </mat-form-field>
                <mat-form-field class="medio">
                    <mat-label>Descrição do Produto</mat-label>
                    <input matInput readonly="">
                </mat-form-field>  
            </div>
            <div>
                <mat-form-field class="pequeno">
                    <mat-label>Qtd. Min</mat-label>
                    <input type="number" matInput formControlName="qtdMin">
                </mat-form-field>
                <mat-form-field class="pequeno">
                    <mat-label>Qtd. Max</mat-label>
                    <input type="number" matInput formControlName="qtdMax">
                </mat-form-field>
                <mat-form-field class="medio3">
                    <mat-label>Ativo?</mat-label>
                    <mat-select required formControlName="snAtivo">
                      <mat-option>-- Selecione --</mat-option>
                      <mat-option value="S">Sim</mat-option>
                      <mat-option value="N">Não</mat-option>
                    </mat-select>                    
                </mat-form-field>
            </div>
            <div class="example-button-row">
                <button matButton="elevated">
                    <mat-icon aria-hidden="false" fontIcon="save"></mat-icon>
Salvar</button>                                
            </div>
        </form>
    </div>
</div>
